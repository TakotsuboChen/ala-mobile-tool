name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Probe preinstalled Android platforms
        run: |
          echo "=== Platforms dir ==="
          ls -la /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "no platforms dir"
          echo "=== Each platform source.properties ==="
          for d in /usr/local/lib/android/sdk/platforms/android-*; do
            [ -d "$d" ] || continue
            echo "--- $d ---"
            cat "$d/source.properties" 2>/dev/null || echo "no source.properties"
          done

      - name: Try install platforms;android-37
        run: |
          # sdkmanager 仓库未发布 platforms;android-37，预期失败。
          # runner 预装 android-37.0（真 API 37），下一步 symlink 兜底。
          (echo y | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-37") 2>&1 || echo "stable channel failed (expected)"

      - name: "Fallback: symlink android-37.0 to android-37 if 37 missing"
        run: |
          if [ ! -d /usr/local/lib/android/sdk/platforms/android-37 ]; then
            echo "android-37 not present, trying fallback"
            # runner 预装 android-37.0（ApiLevel=37.0，真 API 37 platform）
            # AGP 要目录名 android-37，symlink 过去
            for d in /usr/local/lib/android/sdk/platforms/android-37.*; do
              [ -d "$d" ] || continue
              echo "Found $d, symlinking to android-37"
              ln -sf "$d" /usr/local/lib/android/sdk/platforms/android-37
              break
            done
          fi
          echo "=== final platforms dir ==="
          ls -la /usr/local/lib/android/sdk/platforms/ | grep android-37
          echo "=== android-37 source.properties ==="
          cat /usr/local/lib/android/sdk/platforms/android-37/source.properties 2>/dev/null || echo "still missing"

      - name: Install NDK 26.1.10909125
        run: |
          (echo y | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125") 2>&1 || echo "ndk install failed"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lint --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## 安装

            1. 确保已安装 LSPosed。
            2. 从下方 Assets 下载 `app-release.apk`。
            3. 在 LSPosed 中勾选 **Ala Mobile** 作为作用域。
            4. 启动游戏，进入游戏后点击左上角「工具」按钮显示 overlay。
