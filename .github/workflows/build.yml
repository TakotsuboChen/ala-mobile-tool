name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for softprops/action-gh-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git describe / tag history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android SDK components (if missing)
        # runner 自带 platforms;android-37.0 (带小数点)，AGP compileSdk=37
        # 找的是 platforms;android-37。复制目录 + 改 package.xml id 兼容。
        run: |
          SDK=$ANDROID_SDK_ROOT
          if [ ! -d "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            cp -r "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
            # 改 package.xml 里的 id 让 AGP 识别
            sed -i 's/android-37.0/android-37/g' "$SDK/platforms/android-37/package.xml" 2>/dev/null || true
            sed -i 's/android-37.0/android-37/g' "$SDK/platforms/android-37/source.properties" 2>/dev/null || true
            echo "Copied android-37.0 -> android-37 with fixed package.xml"
          fi
          ls "$SDK/platforms/" | grep android-37

      - name: Restore release keystore (from Secret)
        # secrets 不能直接用于 if 条件，先放到 env 再判断
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        if: ${{ env.KS_BASE64 != '' }}
        run: |
          echo "$KS_BASE64" | base64 -d > "$GITHUB_WORKSPACE/ala-mobile-tool.keystore"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ala-mobile-tool.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PWD" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Build debug APK (for CI verification)
        run: ./gradlew :app:assembleDebug

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Tag push (v*) → create Pre-release on GitHub Releases
      - name: Create Pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
