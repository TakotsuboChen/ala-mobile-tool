name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Google SDK 仓库未发布 platforms;android-37，但 GitHub runner 预装了
      # android-37.0（ApiLevel=37，真 API 37 platform，Platform 17）。AGP 要求
      # 目录名 android-37 + package.xml/source.properties 路径标识一致，所以
      # 复制 android-37.0 → android-37 并改路径标识（symlink 会报 inconsistent location）。
      - name: Ensure platforms;android-37 is available
        run: |
          if [ ! -d /usr/local/lib/android/sdk/platforms/android-37 ]; then
            src=/usr/local/lib/android/sdk/platforms/android-37.0
            dst=/usr/local/lib/android/sdk/platforms/android-37
            if [ ! -d "$src" ]; then
              echo "ERROR: $src not found, cannot proceed"
              exit 1
            fi
            cp -r "$src" "$dst"
            sed -i 's|Pkg.Path=platforms;android-37\.0|Pkg.Path=platforms;android-37|' "$dst/source.properties"
            sed -i 's|AndroidVersion.ApiLevel=37\.0|AndroidVersion.ApiLevel=37|' "$dst/source.properties"
            sed -i 's|path="platforms;android-37\.0"|path="platforms;android-37"|g' "$dst/package.xml"
            sed -i 's|<api-level>37\.0</api-level>|<api-level>37</api-level>|g' "$dst/package.xml"
            echo "Cloned $src → $dst and fixed path identifiers"
          fi

      - name: Install NDK 26.1.10909125
        run: |
          (echo y | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125") 2>&1 || echo "ndk install failed"

      # 仅在配了 KEYSTORE_BASE64 secret 时才解码；没配则跳过，
      # Gradle fallback 到 debug 签名，CI 仍能产出可安装 APK。
      # 注意：KEYSTORE_PATH 必须只在解码成功时才设，否则 Gradle 的
      # `System.getenv("KEYSTORE_PATH") != null` 会判到 true 却找不到文件。
      # 用 env 中转 secret 再在 if 里引用：GitHub Actions 的 if 表达式不能
      # 直接读 secrets 上下文（旧经验，HANDOFF 第 5 节记过此坑）。
      - name: Decode release keystore
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$keystore_path"
          echo "KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "Decoded keystore to $keystore_path"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew :app:lint --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # APK 重命名遵循项目命名规则：
      #   Release（tag push）: Ala Mobile Tool v1.0.0 Beta 1.apk
      #   CI 构建（push/PR）:  Ala Mobile Tool v1.0.0 Beta 1 CI.apk（versionCode 与最新 Release 一致）
      # versionName 从 build.gradle.kts 单一事实源提取，避免双源维护。
      # artifact 用 actions/upload-artifact@v7 的 archive:false（2026-02 平台新特性），
      # 跳过强制 zip 打包，浏览器直接下载原始命名 apk。
      # 硬限制：archive:false 只支持单文件、无 glob、忽略 name 参数（显示名=原始文件名）。
      - name: Rename APK to project naming convention
        id: rename_apk
        run: |
          set -eu
          ver=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -e 's/versionName = "//' -e 's/"$//')
          if [ -z "$ver" ]; then echo "ERROR: versionName not found in build.gradle.kts"; exit 1; fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            apk_name="Ala Mobile Tool v${ver}.apk"
          else
            apk_name="Ala Mobile Tool v${ver} CI.apk"
          fi
          src="app/build/outputs/apk/release/app-release.apk"
          dst="app/build/outputs/apk/release/${apk_name}"
          mv "$src" "$dst"
          echo "Renamed $src → $dst"
          echo "apk_path=${dst}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          # 阶段自动推导：Alpha/Beta 发 Pre-release，正式版发正式 Release。
          # 与版本命名规则保持一致（versionName 含阶段后缀 ⇔ prerelease）。
          # 避免之前硬编码 prerelease:true 导致正式版被误发成 Pre-release 的问题。
          if [[ "$ver" == *"Beta"* || "$ver" == *"Alpha"* || "$ver" == *"Pre"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.rename_apk.outputs.apk_path }}
          archive: false

      # Release Notes 先于 CI 存在（/release skill 发版前写入 RELEASE_NOTES.md 并随版本号提交）。
      # 这样 Upload to Release 和 sync-lsposed 读到的都是手工 Notes，镜像仓库不再拿到默认安装说明。
      # fallback：手动打 tag 没写 RELEASE_NOTES.md 时，生成默认安装说明，避免 CI 失败。
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            cat > RELEASE_NOTES.md <<'EOF'
          ## 安装

          1. 确保已安装 LSPosed。
          2. 从下方 Assets 下载 `Ala Mobile Tool v*.apk`。
          3. 在 LSPosed 中勾选 **Ala Mobile** 作为作用域。
          4. 启动游戏，进入游戏后点击左上角「工具」按钮显示 overlay。
          EOF
            echo "RELEASE_NOTES.md not found, generated default install notes"
          else
            echo "Using committed RELEASE_NOTES.md"
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.rename_apk.outputs.is_prerelease == 'true' }}
          name: ${{ github.ref_name }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
          body_path: RELEASE_NOTES.md

  # 发版后自动把 release 同步到官方 LSPosed 模块镜像仓库。
  # 依赖仓库 secret TARGET_REPO_TOKEN（对 Xposed-Modules-Repo/tools.alamobile.mod 有 admin 权限的 PAT）。
  # 失败不影响主发布流程。
  sync-lsposed:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/sync-lsposed-mirror.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
