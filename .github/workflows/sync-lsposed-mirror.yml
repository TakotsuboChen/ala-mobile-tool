name: Sync to LSPosed Modules Repo

# 把本仓库的 release 同步到官方模块镜像仓库
# Xposed-Modules-Repo/tools.alamobile.mod，并按官方规范命名。
#
# 官方命名规范（由 bot 对其他模块的实测确认）：
#   镜像 release tag = <versionCode>-<versionName>，versionName 中空格替换为 `_`
#   例：versionCode=100230, versionName="1.0.0 Beta 3" -> tag=100230-1.0.0_Beta_3
# 本 workflow 直接按该规范建 tag，避免依赖 bot 事后重命名，保证顺序可控。
#
# 顺序：按 versionCode 升序逐个同步（Alpha 1 -> Beta 3），保证镜像列表按发布时间正序。
# 触发方式：
#   1. build.yml 打 tag 发版后 workflow_call 串联（自动同步单个新 tag）
#   2. workflow_dispatch 手动触发：tag 留空 = 全量同步所有历史 release
#
# 跨仓库写依赖 secrets.TARGET_REPO_TOKEN（对镜像仓库有 admin 权限的 PAT）。

on:
  workflow_call:
    inputs:
      tag:
        description: 'Source release tag to sync to the mirror (empty = all releases)'
        required: false
        type: string
        default: ''
    secrets:
      TARGET_REPO_TOKEN:
        required: true
        description: 'PAT with admin access to Xposed-Modules-Repo/tools.alamobile.mod'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source release tag to sync; leave empty to sync ALL releases'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all refs, to read build.gradle.kts per tag)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tags to sync (sorted by versionCode ascending)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC="${{ github.repository }}"
          MIRROR="Xposed-Modules-Repo/tools.alamobile.mod"
          TAGS="${{ inputs.tag }}"
          if [ -z "$TAGS" ]; then
            TAGS=$(gh release list --repo "$SRC" --limit 100 --json tagName -q '.[].tagName')
          fi
          if [ -z "$TAGS" ]; then
            echo "::error::No releases found to sync."
            exit 1
          fi
          # 按 versionCode 升序排序，保证同步顺序 = 发布顺序（Alpha 1 -> Beta 3）
          SORTED=""
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            blade=$(git rev-parse --verify "refs/tags/$TAG^{tree}" >/dev/null 2>&1 && \
              git ls-tree "refs/tags/$TAG^{tree}" app/build.gradle.kts 2>/dev/null | awk '{print $3}' | head -1)
            if [ -z "$blade" ]; then
              echo "::warning::No build.gradle.kts at $TAG, using tag order as-is"
              SORTED="$SORTED $TAG"
              continue
            fi
            VC=$(git cat-file blob "$blade" 2>/dev/null | awk '/versionCode[ ]*=/{print $3}' | head -1)
            SORTED="$SORTED $TAG:$VC"
          done <<< "$TAGS"
          # 按 versionCode 数字升序
          SORTED_UNIQ=$(echo "$SORTED" | tr ' ' '\n' | grep -E ':' | sort -t: -k2 -n | cut -d: -f1 | tr '\n' ' ')
          echo "sorted_tags=$SORTED_UNIQ" >> "$GITHUB_OUTPUT"
          echo "mirror=$MIRROR" >> "$GITHUB_OUTPUT"
          echo "::notice::Sync order: $SORTED_UNIQ"

      - name: Sync releases to mirror (official tag naming)
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TARGET_REPO_TOKEN secret is not set. Create a PAT (scope: repo) for Xposed-Modules-Repo/tools.alamobile.mod and add it as repository secret."
            exit 1
          fi
          SRC="${{ github.repository }}"
          MIRROR="${{ steps.resolve.outputs.mirror }}"
          for TAG in ${{ steps.resolve.outputs.sorted_tags }}; do
            [ -z "$TAG" ] && continue
            echo "===== Syncing $TAG ====="
            # 从该 tag 的 build.gradle.kts 提取 versionCode / versionName -> 官方 tag 名
            blade=$(git rev-parse --verify "refs/tags/$TAG^{tree}" >/dev/null 2>&1 && \
              git ls-tree "refs/tags/$TAG^{tree}" app/build.gradle.kts 2>/dev/null | awk '{print $3}' | head -1)
            if [ -z "$blade" ]; then
              echo "::warning::No build.gradle.kts at $TAG, skipping."
              continue
            fi
            VC=$(git cat-file blob "$blade" 2>/dev/null | awk '/versionCode[ ]*=/{print $3}' | head -1)
            VN=$(git cat-file blob "$blade" 2>/dev/null | grep 'versionName' | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
            if [ -z "$VC" ] || [ -z "$VN" ]; then
              echo "::warning::Could not extract version at $TAG, skipping."
              continue
            fi
            NEW_TAG="${VC}-${VN// /_}"
            echo "  source tag=$TAG -> mirror tag=$NEW_TAG"

            NAME=$(gh release view "$TAG" --repo "$SRC" --json name -q .name)
            PRERELEASE=$(gh release view "$TAG" --repo "$SRC" --json isPrerelease -q .isPrerelease)
            gh release view "$TAG" --repo "$SRC" --json body -q .body > /tmp/body.md || true

            rm -rf "/tmp/rel/$TAG"; mkdir -p "/tmp/rel/$TAG"
            if ! gh release download "$TAG" --repo "$SRC" --pattern "*.apk" --dir "/tmp/rel/$TAG"; then
              echo "::warning::No APK asset for $TAG, skipping."
              continue
            fi
            APKS=(/tmp/rel/$TAG/*.apk)
            if [ ${#APKS[@]} -eq 0 ]; then
              echo "::warning::No APK asset for $TAG, skipping."
              continue
            fi

            # 幂等：镜像已有该 NEW_TAG 则更新，否则创建
            if gh release view "$NEW_TAG" --repo "$MIRROR" >/dev/null 2>&1; then
              gh release edit "$NEW_TAG" --repo "$MIRROR" \
                --title "$NAME" --notes-file /tmp/body.md --prerelease="$PRERELEASE"
              for a in $(gh release view "$NEW_TAG" --repo "$MIRROR" --json assets -q '.assets[] | select(.name|endswith(".apk")) | .name'); do
                gh release delete-asset "$NEW_TAG" "$a" --repo "$MIRROR" || true
              done
              gh release upload "$NEW_TAG" "${APKS[0]}" --repo "$MIRROR" --clobber
            else
              gh release create "$NEW_TAG" --repo "$MIRROR" \
                --title "$NAME" --notes-file /tmp/body.md --prerelease="$PRERELEASE" "${APKS[0]}"
            fi
            echo "::notice::Synced $TAG -> $MIRROR (tag=$NEW_TAG)"
          done

      # 同步 README 到镜像仓库，保留 LSPosed 规范的 Source URL 结尾。
      # 源仓库 README 不含 Source URL 行，镜像仓库需要追加。
      - name: Sync README to mirror
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          SRC="${{ github.repository }}"
          MIRROR="${{ steps.resolve.outputs.mirror }}"
          # 读源仓库 README
          gh api "repos/$SRC/contents/README.md" --jq '.content' | base64 -d > /tmp/readme_src.md
          # 追加 Source URL 结尾（幂等：已存在则不重复追加）
          if ! grep -q "Source URL:" /tmp/readme_src.md; then
            printf '\n---\n\n**Source URL:** https://github.com/%s\n' "$SRC" >> /tmp/readme_src.md
          fi
          # 读镜像仓库当前 README 的 sha（PUT 需要）
          MIRROR_SHA=$(gh api "repos/$MIRROR/contents/README.md" --jq '.sha')
          # 用 GitHub API 更新镜像仓库 README
          gh api -X PUT "repos/$MIRROR/contents/README.md" \
            -f message="Sync README from $SRC" \
            -f content="$(base64 -w0 /tmp/readme_src.md)" \
            -f sha="$MIRROR_SHA" >/dev/null
          echo "::notice::Synced README -> $MIRROR"