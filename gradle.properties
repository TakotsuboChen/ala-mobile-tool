org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 8.9.1 maxRecommendedCompileSdk=36，但 miuix 0.9.3 要求 37
# 抑制"exceeds max recommended"警告，让 release 构建通过
android.suppressUnsupportedCompileSdk=37

# WSL2 下 Kotlin 编译守护进程的 RMI loopback socket 会卡死（常见已知问题）
# 强制在 Gradle 守护进程内联编译，不启动独立 Kotlin 守护进程
kotlin.compiler.execution.strategy=in-process

# ── 构建加速（2026-11-17，实测有效）───────────────────────────────────
# 这里只放**实测有收益**的项。以下这些经实测**无收益**，不要加回来：
#   • android.keepWorkerActionServicesBetweenBuilds  —— aapt2 仅占 0.02s，零收益
#     且触发 "experimental" 告警噪声
#   • android.r8.threadPoolSize / maxWorkers —— AGP 9.3 的 defaultThreadPoolSize()
#     已经是 Runtime.availableProcessors()（12 核 → 12 线程），再配无收益
#   • android.nonTransitiveRClass / nonFinalResIds / enableResourceOptimizations /
#     enableAppCompileTimeRClass / builtInKotlin / newDsl / r8.optimizedResourceShrinking
#     / enableR8.fullMode —— AGP 9.3 已全部默认开启或强制开启，写了只会报错或冗余
#   • org.gradle.parallel=true 在本单模块工程零收益（它并行的是任务/模块，
#     单模块内不并行）；保留只是无害
#
# ⚠️ 真正带来 7 倍提速的是 app/build.gradle.kts 里的构建指纹改造
#    （System.currentTimeMillis → commit 时间），详见该文件注释。
#
# ── R8 的 60~80s 是物理成本，不要再试（2026-11-17 逐项实测排除）───────
#   • android.enableR8.fullMode=false —— 实测 81s vs 81s，零收益
#   • -Xmx7g 加大堆（RSS 实测稳定在 ~3GB 未触顶）—— 80s vs 81s，零收益
#   • android.r8.threadPoolSize —— 采样实证：115 线程里仅 1 个 RUNNABLE、
#     CPU 260~350%（≈3.5/12 核）。全程序分析天然串行，线程池不是瓶颈
#   ⇒ 正确策略是**减少 R8 触发次数**，而非让它更快。R8 任务本身可缓存
#     （实测 FROM-CACHE 正常），只要输入不变就命中。
