org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 8.9.1 maxRecommendedCompileSdk=36，但 miuix 0.9.3 要求 37
# 抑制"exceeds max recommended"警告，让 release 构建通过
android.suppressUnsupportedCompileSdk=37

# WSL2 下 Kotlin 编译守护进程的 RMI loopback socket 会卡死（常见已知问题）
# 强制在 Gradle 守护进程内联编译，不启动独立 Kotlin 守护进程
kotlin.compiler.execution.strategy=in-process
